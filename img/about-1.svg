<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect width="400" height="400" fill="#0d131c"/><rect x="0" y="0" width="400" height="40" fill="#141c28"/><circle cx="20" cy="20" r="6" fill="#f87171"/><circle cx="40" cy="20" r="6" fill="#fbbf24"/><circle cx="60" cy="20" r="6" fill="#34d399"/><text x="90" y="25" font-family="monospace" font-size="12" fill="#8b98a8">scanner.py</text><text x="44" y="96" font-family="monospace" font-size="14"><tspan fill="#c084fc">def </tspan><tspan fill="#60a5fa">scan(target):</tspan></text><text x="16" y="96" font-family="monospace" font-size="12" fill="#3a4a60">1</text><text x="44" y="122" font-family="monospace" font-size="14"><tspan fill="#8b98a8">    </tspan><tspan fill="#e8edf3">hosts = recon(target)</tspan></text><text x="16" y="122" font-family="monospace" font-size="12" fill="#3a4a60">2</text><text x="44" y="148" font-family="monospace" font-size="14"><tspan fill="#c084fc">    for </tspan><tspan fill="#e8edf3">h in hosts:</tspan></text><text x="16" y="148" font-family="monospace" font-size="12" fill="#3a4a60">3</text><text x="44" y="174" font-family="monospace" font-size="14"><tspan fill="#8b98a8">        </tspan><tspan fill="#e8edf3">r = probe(h)</tspan></text><text x="16" y="174" font-family="monospace" font-size="12" fill="#3a4a60">4</text><text x="44" y="200" font-family="monospace" font-size="14"><tspan fill="#c084fc">        if </tspan><tspan fill="#fbbf24">r.vulnerable:</tspan></text><text x="16" y="200" font-family="monospace" font-size="12" fill="#3a4a60">5</text><text x="44" y="226" font-family="monospace" font-size="14"><tspan fill="#8b98a8">            </tspan><tspan fill="#34d399">report(h, r)</tspan></text><text x="16" y="226" font-family="monospace" font-size="12" fill="#3a4a60">6</text><text x="44" y="252" font-family="monospace" font-size="14"><tspan fill="#c084fc">    return </tspan><tspan fill="#e8edf3">findings</tspan></text><text x="16" y="252" font-family="monospace" font-size="12" fill="#3a4a60">7</text><rect x="0" y="300" width="400" height="100" fill="#111823"/><text x="16" y="330" font-family="monospace" font-size="13" fill="#34d399">$ python scanner.py target.com</text><text x="16" y="354" font-family="monospace" font-size="13" fill="#8b98a8">[+] 42 hosts · 3 findings</text><rect x="16" y="368" width="9" height="16" fill="#34d399"/></svg>